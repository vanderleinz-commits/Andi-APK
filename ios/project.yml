name: Andi
options:
  bundleIdPrefix: id.vanderleinz
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
targets:
  Andi:
    type: application
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.vanderleinz.andi
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    sources:
      - App
      - Shared
      - Assets.xcassets
    info:
      path: Generated/Andi-Info.plist
      properties:
        CFBundleDisplayName: Andi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: id.vanderleinz.andi.focus
            CFBundleURLSchemes: [andi]
    dependencies:
      - target: AndiWidgets
  AndiWidgets:
    type: app-extension
    platform: iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.vanderleinz.andi.widgets
        SKIP_INSTALL: 'YES'
    sources:
      - Widgets
      - Shared
      - Assets.xcassets
    info:
      path: Generated/AndiWidgets-Info.plist
      properties:
        CFBundleDisplayName: Andi
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
schemes:
  Andi:
    build:
      targets:
        Andi: all
    run:
      config: Debug
