    compileSdk 35

    defaultConfig {
        applicationId 'id.vanderleinz.andi'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '0.4.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
